name: Milestone intake
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
  contents: read
jobs:
  intake:
    if: ${{ contains(github.event.issue.labels.*.name, 'type:milestone') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            if (context.payload.action === 'edited') {
              const prior = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: issue.number, per_page: 100 });
              if (prior.some((c) => c.user && c.user.login === 'github-actions[bot]' && /<!-- original-due:/.test(c.body))) return;
            }
            const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const field = (label) => {
              const re = new RegExp('###\\s+' + esc(label) + '\\s*\\n+([\\s\\S]*?)(?=\\n###\\s|$)', 'i');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            };
            const clean = (v) => (/^_?no response_?$/i.test(v) ? '' : v);
            const owner = clean(field('Owner (GitHub username)')).replace(/^@/, '');
            const reviewer = clean(field('Reviewer (GitHub username, optional)')).replace(/^@/, '');
            const reward = field('Reward type');
            const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
            const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
            const dateOk = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(Date.parse(d));
            const start = clean(field('Start date (YYYY-MM-DD, optional)')) || today;
            let due = clean(field('Agreed due date'));
            const rel = due.match(/^\+?\s*(\d{1,3})\s*(d|day|days)?$/i);
            if (rel && dateOk(start)) due = addDays(start, parseInt(rel[1], 10));
            const say = (text) => github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: text });

            const notes = [];
            if (owner) {
              try {
                await github.rest.issues.addAssignees({ ...context.repo, issue_number: issue.number, assignees: [owner] });
              } catch (e) {
                notes.push('Could not assign @' + owner + '. Please check the username and that this person has access to this repo.');
              }
            } else {
              notes.push('No owner was given. Please add one.');
            }

            let reviewerOk = '';
            if (reviewer) {
              if (reviewer.toLowerCase() === owner.toLowerCase()) {
                notes.push('The reviewer cannot be the owner. The Studio Lead will check this one.');
              } else {
                try { await github.rest.users.getByUsername({ username: reviewer }); reviewerOk = reviewer; }
                catch (e) { notes.push('Could not find the GitHub user @' + reviewer + '. The Studio Lead will check this one.'); }
              }
            }

            const rewardLabel = /time/i.test(reward) ? 'reward:time' : (/milestone/i.test(reward) ? 'reward:milestone' : '');
            if (rewardLabel) {
              try { await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [rewardLabel] }); } catch (e) {}
            }

            if (!dateOk(start) || !dateOk(due)) {
              notes.push('The start date or the due date is not a real date. Use YYYY-MM-DD (like 2026-11-20) or a number of days (like 14 days). Please edit the issue and fix it. The clock cannot start until both dates are valid.');
              await say(notes.join('\n\n'));
              return;
            }
            if (due < start) {
              notes.push('The due date is before the start date. Please fix it.');
              await say(notes.join('\n\n'));
              return;
            }

            const text = [
              '**Milestone agreed.**',
              '',
              'Owner: @' + owner,
              'Reviewer: ' + (reviewerOk ? '@' + reviewerOk : 'the Studio Lead'),
              'Start: ' + start,
              'Due: ' + due + ' (this date is locked)',
              '',
              'Commands. Write one on the first line of a comment:',
              '- `/submit link` (owner). The work is ready for check. Add a link or a short note as proof. This stops the clock. `/done` works too.',
              '- `/pass` or `/rework` (reviewer). Records the first check. `/approve` and `/redo` work too.',
              '- `/pause N reason` (reviewer). Pauses the clock N days for a Labs delay.',
              '- `/rescope 2026-12-01 reason` (reviewer). Moves the date later after a scope change.',
              '',
              '<!-- original-due:' + due + ' -->',
              '<!-- start:' + start + ' -->'
            ];
            if (reviewerOk) { text.push('<!-- reviewer:' + reviewerOk + ' -->'); }
            if (notes.length) { text.push('', notes.join('\n\n')); }
            await say(text.join('\n'));
