name: Probe project
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const gh = github.getOctokit(process.env.PROJECT_TOKEN);
            const out = [];
            try {
              const r = await gh.graphql(`query { organization(login:"Ighodalo-Labs") { projectV2(number:1) { id title fields(first:50) { nodes { __typename ... on ProjectV2FieldCommon { id name dataType } ... on ProjectV2SingleSelectField { options { id name } } } } } } }`);
              out.push('PROJECT ' + JSON.stringify(r.organization.projectV2, null, 1));
            } catch (e) { out.push('project query failed: ' + e.message); }
            try {
              const r = await gh.graphql(`query { __schema { mutationType { fields { name } } } }`);
              out.push('MUTATIONS ' + r.__schema.mutationType.fields.map(f => f.name).filter(n => /field|issue/i.test(n)).join(', '));
            } catch (e) { out.push('introspection failed: ' + e.message); }
            try {
              const r = await gh.graphql(`query { repository(owner:"Ighodalo-Labs", name:"delivery") { issue(number:4) { id projectItems(first:5) { nodes { id project { id } } } } } }`);
              out.push('ISSUE4 ' + JSON.stringify(r.repository.issue));
            } catch (e) { out.push('issue query failed: ' + e.message); }
            console.log(out.join('\n\n'));
